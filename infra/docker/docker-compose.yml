services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vemtas
      POSTGRES_PASSWORD: vemtas
      POSTGRES_DB: vemtas_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vemtas -d vemtas_dev"]
      interval: 3s
      timeout: 3s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vemtas
      POSTGRES_PASSWORD: vemtas
      POSTGRES_DB: vemtas_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vemtas -d vemtas_test"]
      interval: 3s
      timeout: 3s
      retries: 10
